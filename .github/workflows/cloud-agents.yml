name: Cloud agents (Claude Code ultracode + Codex + Gemini CLI)

# Runs real coding agents on the same task in parallel, then has Claude merge
# every answer. Each result is posted as a comment on the task's issue.
#
#   - Claude Code CLI with the ultracode setting on (Anthropic API, or AWS Bedrock)
#   - OpenAI Codex (openai/codex-action)
#   - Google Gemini CLI (google-github-actions/run-gemini-cli)
#
# Each agent runs only if its secret is set, so connect as many as you like.
#
# Start a run: open an issue with the "agent-run" label (the Relay site's
# "Send task to cloud agents" button does this), or run this workflow by hand
# from the Actions tab. Only the repository owner can start a run, because every
# run spends the owner's API credit.
#
# Repository secrets (any subset):
#   ANTHROPIC_API_KEY         Claude Code + the merge step
#   AWS_BEARER_TOKEN_BEDROCK  Claude Code through AWS Bedrock (used when ANTHROPIC_API_KEY is absent)
#   OPENAI_API_KEY            Codex
#   GEMINI_API_KEY            Gemini CLI
# Optional repository variables:
#   CLAUDE_MODEL (claude-opus-5), CODEX_MODEL (gpt-6-astra), GEMINI_MODEL (gemini-3.8-flash),
#   AWS_REGION (us-east-1), BEDROCK_CLAUDE_MODEL (us.anthropic.claude-opus-5)
#
# Untrusted text (the task) only ever reaches scripts through env vars, never
# through ${{ }} interpolation inside run: blocks.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      task:
        description: Task for the agents
        required: true
        type: string

permissions:
  contents: read

env:
  TASK: ${{ github.event.issue.body || github.event.issue.title || inputs.task }}
  CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5' }}
  CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-6-astra' }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  BEDROCK_CLAUDE_MODEL: ${{ vars.BEDROCK_CLAUDE_MODEL || 'us.anthropic.claude-opus-5' }}
  UNATTENDED: >-
    You are running unattended in a CI job and nobody can answer questions.
    Make reasonable assumptions, state them briefly, and put the complete
    deliverable in your final message as Markdown.

jobs:
  start:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'agent-run'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      issue: ${{ steps.start.outputs.issue }}
      claude: ${{ steps.start.outputs.claude }}
      codex: ${{ steps.start.outputs.codex }}
      gemini: ${{ steps.start.outputs.gemini }}
    steps:
      - id: start
        uses: actions/github-script@v7
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const has = k => process.env[k] === 'true';
            const claude = has('HAS_ANTHROPIC') || has('HAS_BEDROCK');
            const agents = [
              claude && `**Claude Code (ultracode${has('HAS_ANTHROPIC') ? '' : ', via AWS Bedrock'})**`,
              has('HAS_OPENAI') && '**OpenAI Codex**',
              has('HAS_GEMINI') && '**Gemini CLI**',
            ].filter(Boolean);
            core.setOutput('claude', String(claude));
            core.setOutput('codex', String(has('HAS_OPENAI')));
            core.setOutput('gemini', String(has('HAS_GEMINI')));

            let issue = context.payload.issue && context.payload.issue.number;
            if (!issue) {
              const title = 'Cloud run: ' + process.env.TASK.replace(/\s+/g, ' ').slice(0, 70);
              issue = (await github.rest.issues.create({ owner, repo, title, body: process.env.TASK, labels: ['agent-run'] })).data.number;
            }
            core.setOutput('issue', String(issue));
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let body;
            if (!agents.length) {
              body = `⚠️ No agent can run: add at least one repository secret (ANTHROPIC_API_KEY, AWS_BEARER_TOKEN_BEDROCK, OPENAI_API_KEY or GEMINI_API_KEY) under Settings → Secrets and variables → Actions, then open a new issue.`;
            } else {
              body = `🚀 Working in parallel: ${agents.join(', ')}.${claude ? ' Claude merges every answer at the end.' : ''} [Watch the run](${run})`;
              const off = [
                !claude && 'Claude Code (ANTHROPIC_API_KEY or AWS_BEARER_TOKEN_BEDROCK)',
                !has('HAS_OPENAI') && 'Codex (OPENAI_API_KEY)',
                !has('HAS_GEMINI') && 'Gemini CLI (GEMINI_API_KEY)',
              ].filter(Boolean);
              if (off.length) body += `\n\n<sub>Not connected: ${off.join(' · ')}. Add the secret to include it.</sub>`;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(issue), body });

  claude:
    needs: start
    if: needs.start.outputs.claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Claude Code with ultracode on
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          set +e
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            export CLAUDE_CODE_USE_BEDROCK=1
            export MODEL="$BEDROCK_CLAUDE_MODEL" VIA="AWS Bedrock"
          else
            unset AWS_BEARER_TOKEN_BEDROCK
            export MODEL="$CLAUDE_MODEL" VIA="Anthropic API"
          fi
          claude --version
          # ultracode = xhigh effort + dynamic workflows. In -p mode the Workflow
          # tool must be allowed explicitly or the workflow launch is denied.
          claude -p "$TASK" \
            --model "$MODEL" \
            --settings '{"ultracode": true, "workflowSizeGuideline": "medium"}' \
            --allowedTools "Workflow,Agent,Read,Glob,Grep,WebSearch,WebFetch,TodoWrite" \
            --append-system-prompt "$UNATTENDED" \
            --max-turns 80 \
            --output-format json > claude.json 2> claude.err
          code=$?
          if jq -e .result claude.json > /dev/null 2>&1; then
            jq -r '.result' claude.json > claude.md
            jq -r '"\n\n---\n<sub>Claude Code · \(env.MODEL) via \(env.VIA) · ultracode · \(.num_turns // "?") turns · $\((.total_cost_usd // 0) * 100 | round / 100) · \((.duration_ms // 0) / 60000 | floor) min</sub>"' claude.json >> claude.md
          else
            { echo "Claude Code failed (exit $code, via $VIA)."; echo; echo '```'; tail -c 3000 claude.err; tail -c 2000 claude.json; echo '```'; } > claude.md
          fi
      - name: Post Claude Code result
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.start.outputs.issue }}
        with:
          script: |
            const fs = require('fs');
            let text = fs.existsSync('claude.md') ? fs.readFileSync('claude.md', 'utf8')
              : 'Claude Code produced no output (the job failed or timed out). Open the run for details.';
            if (text.length > 60000) text = text.slice(0, 60000) + '\n\n…(truncated; the full text is in the run artifacts)';
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.ISSUE), body: '## 🟠 Claude Code (ultracode)\n\n' + text });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude
          path: claude.md
          if-no-files-found: ignore

  codex:
    needs: start
    if: needs.start.outputs.codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Write prompt
        run: printf '%s\n\n%s\n' "$UNATTENDED" "$TASK" > "$RUNNER_TEMP/codex-prompt.md"
      - id: codex
        name: Codex at xhigh effort
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          model: ${{ env.CODEX_MODEL }}
          effort: xhigh
          sandbox: read-only
          output-file: ${{ runner.temp }}/codex.md
      - id: codex_retry
        name: Retry Codex at high effort
        if: steps.codex.outcome == 'failure'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-prompt.md
          model: ${{ env.CODEX_MODEL }}
          effort: high
          sandbox: read-only
          output-file: ${{ runner.temp }}/codex.md
      - name: Post Codex result
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.start.outputs.issue }}
          OUT: ${{ runner.temp }}/codex.md
          EFFORT: ${{ steps.codex.outcome == 'success' && 'xhigh' || 'high' }}
        with:
          script: |
            const fs = require('fs');
            let text = fs.existsSync(process.env.OUT) ? fs.readFileSync(process.env.OUT, 'utf8').trim() : '';
            if (!text) text = 'Codex produced no output (check the OPENAI_API_KEY secret, model access and credit). Open the run for details.';
            else text += `\n\n---\n<sub>OpenAI Codex · ${process.env.CODEX_MODEL} · effort ${process.env.EFFORT}</sub>`;
            if (text.length > 60000) text = text.slice(0, 60000) + '\n\n…(truncated; the full text is in the run artifacts)';
            fs.writeFileSync('codex.md', text);
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.ISSUE), body: '## 🟢 OpenAI Codex\n\n' + text });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex
          path: codex.md
          if-no-files-found: ignore

  gemini:
    needs: start
    if: needs.start.outputs.gemini == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: gemini
        name: Gemini CLI
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ env.GEMINI_MODEL }}
          prompt: ${{ format('{0} {1}', env.UNATTENDED, env.TASK) }}
      - name: Post Gemini result
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.start.outputs.issue }}
          SUMMARY: ${{ steps.gemini.outputs.summary }}
          ERR: ${{ steps.gemini.outputs.error }}
        with:
          script: |
            const fs = require('fs');
            let text = (process.env.SUMMARY || '').trim();
            if (!text) text = 'Gemini CLI produced no output' + (process.env.ERR ? ':\n\n```\n' + process.env.ERR.slice(-3000) + '\n```' : ' (check the GEMINI_API_KEY secret and model access). Open the run for details.');
            else text += `\n\n---\n<sub>Google Gemini CLI · ${process.env.GEMINI_MODEL}</sub>`;
            if (text.length > 60000) text = text.slice(0, 60000) + '\n\n…(truncated)';
            fs.writeFileSync('gemini.md', text);
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.ISSUE), body: '## 🔵 Google Gemini CLI\n\n' + text });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini
          path: gemini.md
          if-no-files-found: ignore

  merge:
    needs: [start, claude, codex, gemini]
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: results
      - uses: actions/setup-node@v4
        if: needs.start.outputs.claude == 'true'
        with:
          node-version: 22
      - name: Install Claude Code
        if: needs.start.outputs.claude == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: Merge every answer
        if: needs.start.outputs.claude == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
        run: |
          set +e
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -n "$AWS_BEARER_TOKEN_BEDROCK" ]; then
            export CLAUDE_CODE_USE_BEDROCK=1; MODEL="$BEDROCK_CLAUDE_MODEL"
          else
            unset AWS_BEARER_TOKEN_BEDROCK; MODEL="$CLAUDE_MODEL"
          fi
          {
            printf 'Task:\n%s\n\n' "$TASK"
            n=0
            for f in claude codex gemini; do
              if [ -s "results/$f/$f.md" ]; then
                n=$((n+1))
                case $f in claude) name='Claude Code (ultracode)';; codex) name='OpenAI Codex';; gemini) name='Google Gemini CLI';; esac
                printf '\n\n## Answer from %s\n\n' "$name"
                cat "results/$f/$f.md"
              fi
            done
            printf '\n\nCompare the answers above. Where they disagree, decide which is right and why. '
            printf 'Start with at most five bullets on what each got right or wrong, then write the single best final answer to the task, combining their strengths.\n'
          } > merge-prompt.md
          # Prompt goes in on stdin: a single command-line argument is capped at 128 KB on Linux.
          claude -p --model "$MODEL" --effort high --max-turns 3 --output-format json < merge-prompt.md > merge.json 2> merge.err
          code=$?
          if jq -e .result merge.json > /dev/null 2>&1; then
            jq -r '.result' merge.json > merge.md
          else
            { echo "The merge step failed (exit $code)."; echo; echo '```'; tail -c 3000 merge.err; echo '```'; } > merge.md
          fi
      - name: Post merged answer and mark the run done
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.start.outputs.issue }}
          HAS_CLAUDE: ${{ needs.start.outputs.claude }}
        with:
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.ISSUE);
            if (process.env.HAS_CLAUDE === 'true') {
              let text = fs.existsSync('merge.md') ? fs.readFileSync('merge.md', 'utf8') : 'The merge step produced no output.';
              if (text.length > 60000) text = text.slice(0, 60000) + '\n\n…(truncated)';
              await github.rest.issues.createComment({ ...context.repo, issue_number, body: '## ✅ Final answer (Claude merged every answer)\n\n' + text });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body: '✅ Done. (No merge: add ANTHROPIC_API_KEY or AWS_BEARER_TOKEN_BEDROCK to have Claude merge the answers.)' });
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: ['agent-done'] });

      # --------------------------------------------------------------------
      # KakaoTalk notification.
      #
      # Browser runs already notify via the app (app.js kakaoSend). Cloud runs
      # did not, which is the case where it actually matters: an ultracode run
      # takes minutes, so you start it and walk away.
      #
      # Sends to the repo owner's own KakaoTalk ("send to me" / talk_message).
      # Only the owner can start a run, so the owner is the only recipient.
      #
      # One-time setup — Settings → Secrets and variables → Actions:
      #   KAKAO_REST_KEY        the Kakao app's REST API key
      #   KAKAO_REFRESH_TOKEN   a refresh token with the talk_message scope
      #   KAKAO_CLIENT_SECRET   optional, only if the app requires it
      #
      # Get the refresh token by connecting KakaoTalk once in the Relay app,
      # then copying it from Settings. Access tokens expire in hours, so this
      # step trades the refresh token for a fresh one on every run.
      #
      # Skipped entirely when the secrets are absent, matching how every other
      # agent in this workflow is optional.
      - name: Notify on KakaoTalk
        if: always()
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          ISSUE: ${{ needs.start.outputs.issue }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          if [ -z "${KAKAO_REST_KEY:-}" ] || [ -z "${KAKAO_REFRESH_TOKEN:-}" ]; then
            echo "KakaoTalk secrets not set — skipping notification."
            exit 0
          fi

          # Refresh the access token. Kakao access tokens are short-lived, so a
          # stored one would be stale by the time a run finishes.
          ACCESS=$(curl -sS -X POST 'https://kauth.kakao.com/oauth/token' \
            -H 'Content-Type: application/x-www-form-urlencoded;charset=utf-8' \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=${KAKAO_REST_KEY}" \
            --data-urlencode "refresh_token=${KAKAO_REFRESH_TOKEN}" \
            ${KAKAO_CLIENT_SECRET:+--data-urlencode "client_secret=${KAKAO_CLIENT_SECRET}"} \
            | jq -r '.access_token // empty')

          if [ -z "$ACCESS" ]; then
            echo "Could not refresh the Kakao token. The refresh token may have expired — reconnect in the Relay app and update KAKAO_REFRESH_TOKEN."
            exit 0
          fi

          # Kakao's text template caps at 200 characters, so send a short
          # summary and let the button carry them to the full answer.
          # TASK is untrusted text and reaches this only through the env block
          # above, never through GitHub expression interpolation. (Writing that
          # interpolation syntax literally here would itself be evaluated: this
          # is a run: block, not a YAML comment.)
          SUMMARY=$(printf '%s' "$TASK" | tr '\n' ' ' | cut -c1-90)
          STATUS_LINE="Cloud agents finished"
          [ "${JOB_STATUS:-success}" != "success" ] && STATUS_LINE="Cloud agents finished with errors"

          LINK="${REPO_URL}/issues/${ISSUE}"
          TEXT=$(printf '%s\n\n%s\n\nTap to read the merged answer.' "$STATUS_LINE" "$SUMMARY")

          TEMPLATE=$(jq -n --arg t "$TEXT" --arg u "$LINK" '{
            object_type: "text",
            text: $t,
            link: { web_url: $u, mobile_web_url: $u },
            button_title: "Read the answer"
          }')

          CODE=$(curl -sS -o /tmp/kakao.json -w '%{http_code}' \
            -X POST 'https://kapi.kakao.com/v2/api/talk/memo/default/send' \
            -H "Authorization: Bearer ${ACCESS}" \
            -H 'Content-Type: application/x-www-form-urlencoded;charset=utf-8' \
            --data-urlencode "template_object=${TEMPLATE}")

          if [ "$CODE" = "200" ]; then
            echo "KakaoTalk notification sent."
          else
            echo "KakaoTalk send failed (HTTP $CODE):"
            cat /tmp/kakao.json
          fi

      # --------------------------------------------------------------------
      # Telegram notification.
      #
      # Parallel to the KakaoTalk step, and the practical fallback when Kakao
      # is unavailable — a blocked Kakao Developers account, or not wanting to
      # wait on channel review. Telegram needs no review and no business
      # verification: a bot token from @BotFather is enough.
      #
      # One-time setup — Settings → Secrets and variables → Actions:
      #   TELEGRAM_BOT_TOKEN   from @BotFather in Telegram
      #   TELEGRAM_CHAT_ID     your own chat id (see the README)
      #
      # Skipped when the secrets are absent, like every other optional step.
      - name: Notify on Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ISSUE: ${{ needs.start.outputs.issue }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets not set — skipping notification."
            exit 0
          fi

          STATUS_LINE="Cloud agents finished"
          [ "${JOB_STATUS:-success}" != "success" ] && STATUS_LINE="Cloud agents finished with errors"

          LINK="${REPO_URL}/issues/${ISSUE}"

          # TASK is untrusted text and reaches this only through the env block
          # above. Telegram accepts 4096 characters, far more than Kakao's 200,
          # so the summary can be generous.
          SUMMARY=$(printf '%s' "$TASK" | tr '\n' ' ' | cut -c1-300)

          # jq builds the JSON so any quotes or backslashes in the task are
          # escaped properly rather than breaking the payload.
          PAYLOAD=$(jq -n \
            --arg chat "$TELEGRAM_CHAT_ID" \
            --arg text "$(printf '%s\n\n%s\n\n%s' "$STATUS_LINE" "$SUMMARY" "$LINK")" \
            '{chat_id: $chat, text: $text, disable_web_page_preview: false}')

          CODE=$(curl -sS -o /tmp/tg.json -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD")

          if [ "$CODE" = "200" ]; then
            echo "Telegram notification sent."
          else
            echo "Telegram send failed (HTTP $CODE):"
            cat /tmp/tg.json
          fi
